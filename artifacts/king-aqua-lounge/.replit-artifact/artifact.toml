kind = "web"
previewPath = "/"
title = "King Aqua Lounge"
version = "1.0.0"
id = "artifacts/king-aqua-lounge"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24232

[services.development]
run = "pnpm --filter @workspace/king-aqua-lounge run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/king-aqua-lounge", "run", "build" ]
publicDir = "artifacts/king-aqua-lounge/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24232"
BASE_PATH = "/"
